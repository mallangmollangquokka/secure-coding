{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="hero">
  <div class="hero-stars">
    <svg viewBox="0 0 24 24"><path d="M12 0C12 6 13 11 24 12 13 13 12 18 12 24 12 18 11 13 0 12 11 11 12 6 12 0Z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 0C12 6 13 11 24 12 13 13 12 18 12 24 12 18 11 13 0 12 11 11 12 6 12 0Z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 0C12 6 13 11 24 12 13 13 12 18 12 24 12 18 11 13 0 12 11 11 12 6 12 0Z"/></svg>
  </div>
  <h1>회원가입</h1>
</div>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="username">사용자명</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
    <p class="hint">8자 이상, 영문 대/소문자, 숫자, 특수문자를 각 1개 이상 포함해야 합니다.</p>
  </div>
  <button type="submit">회원가입</button>
</form>
<p class="hint" style="text-align:center">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
{% endblock %}
