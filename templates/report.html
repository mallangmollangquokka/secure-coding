{% extends "base.html" %}
{% block title %}신고하기{% endblock %}
{% block content %}
<h2>신고하기</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  신고 대상 종류:
  <div class="radio-group">
    <label><input type="radio" name="target_type" value="user" {% if target_type == 'user' %}checked{% endif %} required> 사용자</label>
    <label><input type="radio" name="target_type" value="product" {% if target_type == 'product' or not target_type %}checked{% endif %} required> 상품</label>
  </div>
  신고 대상 ID: <input type="text" name="target_id" value="{{ target_id or '' }}" required><br>
  신고 사유: <br>
  <textarea name="reason" rows="4" cols="50" required></textarea><br>
  <button type="submit">신고 접수</button>
</form>
{% endblock %}
