{% extends "base.html" %}
{% block title %}프로필{% endblock %}
{% block content %}
<h2>프로필 관리</h2>
<p>사용자명: <strong>{{ user.username }}</strong> &nbsp;·&nbsp; <a href="{{ url_for('user_profile', user_id=user.id) }}">공개 프로필 보기</a></p>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="bio">소개글</label>
    <textarea id="bio" name="bio" rows="4">{{ user.bio or '' }}</textarea>
  </div>
  <button type="submit">프로필 업데이트</button>
</form>

<div class="section-title">비밀번호 변경</div>
<form method="post" action="{{ url_for('change_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="current_password">현재 비밀번호</label>
    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
  </div>
  <div class="field">
    <label for="new_password">새 비밀번호</label>
    <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
    <p class="hint">8자 이상, 영문 대/소문자, 숫자, 특수문자를 각 1개 이상 포함해야 합니다.</p>
  </div>
  <div class="field">
    <label for="new_password_confirm">새 비밀번호 확인</label>
    <input type="password" id="new_password_confirm" name="new_password_confirm" autocomplete="new-password" required>
  </div>
  <button type="submit">비밀번호 변경</button>
</form>
{% endblock %}
