{% extends "base.html" %}
{% block title %}쪽지함{% endblock %}
{% block content %}
<h2>쪽지함</h2>
{% if partners %}
<div class="thread-list">
  {% for p in partners %}
    <a class="thread-item" href="{{ url_for('dm_thread', user_id=p.id) }}">
      <div class="avatar">{{ p.username[:1] }}</div>
      <div class="name">{{ p.username }}</div>
    </a>
  {% endfor %}
</div>
{% else %}
<p class="empty">주고받은 쪽지가 없습니다.</p>
{% endif %}
{% endblock %}
